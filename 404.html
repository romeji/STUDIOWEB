<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#171329">
  <title>Page introuvable | JL Studio Web</title>
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/brand/favicon.png">
  <style>
    :root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#171329;color:#f8f7fc}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#392d67 0%,#171329 60%)}
    main{width:min(100%,620px);text-align:center;padding:clamp(28px,7vw,64px);border:1px solid #ffffff1a;border-radius:28px;background:#ffffff08;box-shadow:0 28px 80px #08061166}
    .brand{display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:850;letter-spacing:.04em}
    .bolt{font-size:1.5rem;color:#ffae50}
    .code{margin:42px 0 0;color:#ffbc73;font-size:.85rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
    h1{margin:10px 0 12px;font-size:clamp(2rem,7vw,3.4rem);line-height:1.08;letter-spacing:-.04em}
    p{max-width:430px;margin:0 auto;color:#c9c5d8;line-height:1.7}
    nav{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:30px}
    .button{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:12px 20px;border:1px solid #ffffff2b;border-radius:999px;color:#fff;text-decoration:none;font-weight:750}
    .button.primary{border:0;background:linear-gradient(120deg,#7562dd,#9b60c5);box-shadow:0 9px 26px #6856cf45}
    a:focus-visible{outline:3px solid #ffbc73;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="JL Studio Web, accueil"><span class="bolt" aria-hidden="true">⚡</span><span>JL STUDIO WEB</span></a>
    <p class="code">Erreur 404</p>
    <h1>Cette page n’existe pas.</h1>
    <p>Le lien a peut-être changé ou comporte une erreur. Retrouvez l’accueil ou contactez-moi si vous cherchiez une page précise.</p>
    <nav aria-label="Liens utiles">
      <a class="button primary" href="/">Retour à l’accueil</a>
      <a class="button" href="/contact">Me contacter</a>
    </nav>
  </main>
</body>
</html>
